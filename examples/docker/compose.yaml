services:
  streamlit:
    build: .
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
